name: Update Product Data from Google Sheet

on:
  repository_dispatch:
    types: [update-product-data]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Create data directory
        run: mkdir -p data

      - name: Fetch Data via Python
        run: |
          python3 -c '
          import urllib.request, json

          urls = {
              "data/products_sock.json": "https://script.google.com/macros/s/AKfycbxECsm7sqwkmmxcyt1Arw553FCOvjBaj8oqJxL-k6DLMUjklgyG736xCcV8SwRQd3nw/exec?sheet=SOCK",
              "data/products_tshirt.json": "https://script.google.com/macros/s/AKfycbxECsm7sqwkmmxcyt1Arw553FCOvjBaj8oqJxL-k6DLMUjklgyG736xCcV8SwRQd3nw/exec?sheet=TSHIRT",
              "data/products_inside.json": "https://script.google.com/macros/s/AKfycbxECsm7sqwkmmxcyt1Arw553FCOvjBaj8oqJxL-k6DLMUjklgyG736xCcV8SwRQd3nw/exec?sheet=INSIDE"
          }

          for path, url in urls.items():
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req) as response:
                      data = response.read().decode("utf-8")
                      with open(path, "w", encoding="utf-8") as f:
                          f.write(data)
                  print(f"Successfully fetched {path}")
              except Exception as e:
                  print(f"Error fetching {path}: {e}")
          '

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git commit -m "auto: update product data from Google Sheet" || exit 0
          git push